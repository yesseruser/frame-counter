[project]
name = "frame-counter"
version = "0.1.1"
description = "Frame counter CLI for speedrun verification"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
frame-counter = "frame_counter:main"

[tool.setuptools.packages.find]
where = ["src"]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"
